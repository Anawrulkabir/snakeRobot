name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The locked environment (uv.lock), on the Python that produced the saved runs.
      - name: Install (locked)
        run: uv sync --frozen --python 3.13
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format check
        run: uv run --frozen ruff format --check .
      # A non-zero pytest exit fails the job.
      - name: Tests
        run: uv run --frozen pytest -q
