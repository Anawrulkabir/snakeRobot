# Robot parameters. Single source of truth for snake/model_builder.py.
#
# Every entry is {value, source, note}. Units are SI; angles are in degrees
# only where the key name says _deg.
#   source: hardware     -> CLAUDE.md section 4 (Fahad's first estimates)
#           paper        -> Wang et al. 2023, page given in note
#           decision     -> a logged gate decision in docs/decisions.md
#           proposal     -> Claude's proposal in docs/model_plan.md (approved at G1)
#           placeholder  -> NOT a real value. Exists only so the model compiles.
#                           No reported result may depend on it.
# snake.config.placeholders() lists every placeholder still in use.

body:
  n_segments:
    value: 7
    source: hardware
    note: "7 rigid segments, 6 yaw joints"
  segment_pitch:
    value: 0.10
    source: hardware
    note: "m, distance between consecutive joint axes"
  segment_width:
    value: 0.05
    source: placeholder
    note: "m, capsule diameter. G1: Fahad keeps it as a parameter until the print design is fixed"
  ride_height:
    value: 0.03
    source: placeholder
    note: "m, height of the body axis above the ground. Set by the wheel and mount design"

mass:
  # Fahad's estimates, 2026-10-16 (docs/decisions.md G3). Placeholders until weighed.
  servo:
    value: 0.0135
    source: placeholder
    note: "kg per servo, MG90S class. Fahad's estimate; weigh the real part"
  shell:
    value: 0.020
    source: placeholder
    note: "kg per printed PLA shell. Fahad's rough guess, depends on wall and infill"
  hardware:
    value: 0.005
    source: placeholder
    note: "kg per segment for wheel, axle and screws (the wheel's own mass is mass.wheel, included in this)"
  wheel:
    value: 0.002
    source: placeholder
    note: "kg, the rotating wheel itself (part of mass.hardware). Needs a nonzero value for the axle dynamics"
  head_electronics:
    value: 0.050
    source: placeholder
    note: "kg extra in the head: ESP32, 2S LiPo, regulator, wiring. Fahad's estimate"
  servos_per_joint:
    value: 1
    source: hardware
    note: "CLAUDE.md section 4. The paper uses 2 (one per cable); decided at G4"

joint:
  hard_limit_deg:
    value: 90
    source: paper
    note: "mechanical stop of the printed joint, copied from the paper's +-90 deg joint (p. 54)"
  stiffness:
    value: 0.0
    source: proposal
    note: "N m/rad passive stiffness. Paper's sleeve: 'weak passive elasticity', no value (UNKNOWN). Varied in E4"
  damping:
    value: 0.0
    source: proposal
    note: "N m s/rad passive damping. UNKNOWN; varied in E4"

cable:
  # Joint geometry copied from paper Fig. S4: pin at L_j from each segment face,
  # cable anchors at +-L_c from the centreline on each face.
  half_spacing:
    value: 0.020
    source: placeholder
    note: "m, L_c. Set at G4 from the segment width and joint design"
  joint_offset:
    value: 0.020
    source: placeholder
    note: "m, L_j. Set at G4"

servo:
  stall_torque:
    value: 0.2
    source: hardware
    note: "N m, MG90S-class assumption until the real servo is confirmed (G7)"
  speed_s_per_60deg:
    value: 0.1
    source: hardware
    note: "s per 60 deg, assumption until confirmed"
  kp:
    value: 2.0
    source: placeholder
    note: "N m/rad, position-servo gain for the stiff body (E0). Replaced by actuation A/B later"

ground:
  # G3: passive wheels (docs/decisions.md). One wheel under each segment centre,
  # axle across the body, so it rolls along the body axis.
  model:
    value: wheels
    source: decision
    note: "G3 option 1"
  friction_sliding:
    value: 0.5
    source: placeholder
    note: "Coulomb mu between wheel tyre and floor. UNKNOWN (paper gives only the 1.6:1 ratio)"
  wheel_radius:
    value: 0.012
    source: placeholder
    note: "m. Set by the wheel Fahad buys or prints"
  wheel_half_width:
    value: 0.003
    source: placeholder
    note: "m"
  axle_friction:
    value: 0.0
    source: placeholder
    note: "N m, dry friction on the wheel axle (MuJoCo frictionloss); the only forward rolling resistance in the model. UNKNOWN"
  axle_friction_timeconst:
    value: 0.002
    source: proposal
    note: "s, solreffriction time constant of the axle friction. MuJoCo's default (0.02 s) made the 'dry' friction act viscous below ~0.1 m/s (force proportional to speed); 0.002 s gives the Coulomb value by 0.05 m/s (tests/test_wheels.py). Must stay >= 2 x timestep"

sim:
  timestep:
    value: 0.001
    source: proposal
    note: "s. Convergence check at 0.0005 s is required (CLAUDE.md section 9)"
  integrator:
    value: implicitfast
    source: proposal
    note: "implicit in velocity-dependent forces, so stiff position servos stay stable"
