# Local hooks: they use ruff from the locked environment (uv.lock), so the
# hook version always matches CI and no hook repository is downloaded.
#   uv sync && uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]
